name: Deploy

# Publishes an arm64 image to GHCR on every push to main. Nothing here talks to
# the Raspberry Pi. The Pi polls GHCR and deploys itself (see deploy/README.md).
on:
  push:
    branches:
      - main

# A newer commit on main makes an in-flight build obsolete, but let it finish so
# the :sha tag stays available for rollback.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  publish:
    name: Build and Publish arm64 Image
    needs: verify
    # Native arm64 runner, free on public repos. Building the Pi's image under
    # QEMU emulation instead takes roughly an hour.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          # deploy.sh reads the revision label to log which commit it is deploying.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          echo "Published \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Pi picks this up within two minutes." >> "$GITHUB_STEP_SUMMARY"
          echo "To roll back: \`IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d meridian-backend\`" >> "$GITHUB_STEP_SUMMARY"
