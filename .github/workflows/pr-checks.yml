name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install BAML and generate the SDK
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' baml.toml)"
          curl -fsSL https://pkg.boundaryml.com/install.sh | sh -s -- --version "$version" --no-modify-path
          echo "$HOME/.baml/bin" >> $GITHUB_PATH
          $HOME/.baml/bin/baml generate

      - name: Run linter
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Generate OpenAPI spec and check for drift
        run: |
          pnpm generate:openapi
          git diff --exit-code openapi.json
