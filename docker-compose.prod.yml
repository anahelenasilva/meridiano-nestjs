version: '3.8'

services:
  meridian-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_HOST: goal-tracker-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: meridian
      CORS_ORIGINS: http://89.116.214.113
    depends_on:
      goal-tracker-postgres:
        condition: service_healthy
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3005/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  meridian-frontend:
    build:
      context: ../meridiano-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    container_name: meridian-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    depends_on:
      - meridian-backend
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3006/meridian/']
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  meridian-network:
    driver: bridge
  goal-tracker-network:
    external: true
