version: '3.8'

services:
  meridian-postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meridian-network

  meridian-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_HOST: meridian-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      CORS_ORIGINS: http://89.116.214.113
    depends_on:
      meridian-postgres:
        condition: service_healthy
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3005/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  meridian-frontend:
    build:
      context: ../meridiano-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    container_name: meridian-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    depends_on:
      - meridian-backend
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3006/meridian/']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  meridian_postgres_data:

networks:
  meridian-network:
    driver: bridge
  goal-tracker-network:
    external: true
