version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: meridiano-redis-prod
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian-network

  # Node-RED for Telegram Bot Integration
  nodered:
    image: nodered/node-red:latest
    container_name: meridiano-nodered-prod
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    environment:
      - MERIDIANO_API_URL=http://meridian-backend:3005
      # Telegram Bot token should be set via Node-RED credentials (not env var for security)
      # EXTERNAL_API_TOKEN is configured in Node-RED flow settings
    networks:
      - meridian-network
    depends_on:
      - meridian-backend

  meridian-backend:
    # Built and published by .github/workflows/deploy.yml, never built on the Pi.
    # Pin IMAGE_TAG to a commit sha to roll back to that build.
    image: ghcr.io/anahelenasilva/meridiano-nestjs:${IMAGE_TAG:-main}
    container_name: meridian-backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # AI API Keys
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      # Mailgun API Keys
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      # Empty means allow any origin, which is the sane default on a private
      # tailnet. Set it in .env to lock the API to specific origins.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # External Article Submission (Telegram Bot Integration)
      # Comma-separated list of valid tokens - SET IN PRODUCTION ENVIRONMENT
      EXTERNAL_API_TOKENS: ${EXTERNAL_API_TOKENS:-}
      # Disable Telegram integration initially in production (enable after testing)
      TELEGRAM_INTEGRATION_ENABLED: ${TELEGRAM_INTEGRATION_ENABLED:-false}
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3005/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run before the server binds. Without this grace period a slow
      # migration reads as unhealthy and deploy.sh rolls back a good build.
      start_period: 90s

  meridian-frontend:
    build:
      context: ../meridiano-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    container_name: meridian-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      NEXT_PUBLIC_API_BASE_URL: http://89.116.214.113/meridian-api
    depends_on:
      - meridian-backend
    networks:
      - meridian-network
      - goal-tracker-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3006/meridian/']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    name: meridiano-redis-data-prod
  nodered_data:
    name: meridiano-nodered-data-prod

networks:
  meridian-network:
    name: meridian-network
    driver: bridge
  goal-tracker-network:
    name: goal-tracker-network
    external: true
