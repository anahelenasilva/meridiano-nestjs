[package]
name = "meridiano"

# The bridge in package.json (@boundaryml/baml-bridge) must match this version.
[toolchain]
version = "0.20.1"

# Emits libs/baml/baml_sdk (gitignored). `pnpm build` regenerates it; run
# `baml generate` after editing baml_src/ when using ts-node or tests.
[generator.typescript]
output_type = "typescript/node"
output_dir = "libs/baml"
naming_convention = "preserve-case"
